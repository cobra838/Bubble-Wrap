<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bubble Wrap</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="assets/fonts/ninP_RodinNTLG-B_DH_003_subset.bfotf-italic_84.woff2" as="font" crossorigin />
    <link rel="preload" href="assets/fonts/ninP_RodinNTLG-M_DH_003_subset.bfotf-italic_84.woff2" as="font" crossorigin />
    <link rel="preload" href="assets/fonts/CafeStd-italic_84.woff2" as="font" crossorigin />
    <link rel="preload" href="assets/fonts/CafeStd-italic_84-thin.woff2" as="font" crossorigin />
    <link rel="preload" href="assets/fonts/Calamity-Bold.woff2" as="font" crossorigin />
    <link rel="preload" href="assets/fonts/Calamity-Regular.woff2" as="font" crossorigin />
    <link rel="preload" href="assets/fonts/Inter-Regular.woff" as="font" crossorigin />
    <link rel="preload" href="assets/fonts/Inter-Bold.woff2" as="font" crossorigin />
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div id="toolbar">
      <h1>Bubble Wrap</h1>
      <div class="sep"></div>
      <button class="tbtn game-btn active" id="btn-botw" onclick="selectGame('BotW')">BotW</button>
      <button class="tbtn game-btn" id="btn-totk" onclick="selectGame('TotK')">TotK</button>
      <div class="sep"></div>
      <div id="file-drop" onclick="document.getElementById('file-input').click()">📂 Open YAML / .msyt / texts.json</div>
      <input type="file" id="file-input" accept=".yaml,.yml,.json,.msyt" />
      <div class="sep"></div>
      <button class="tbtn" id="btn-meta" onclick="toggleMeta()">⚙ Meta</button>
      <button class="tbtn" id="btn-export" onclick="exportYaml()">📋 Export</button>
      <button class="tbtn" id="btn-compare" onclick="startCompare()" oncontextmenu="openCompareMenu(event)">Compare</button>
      <input type="file" id="compare-file-input" accept=".yaml,.yml,.json,.msyt" />
      <div id="compare-menu">
        <label>Files per comparison <input id="compare-files-per-group" type="number" min="1" value="2" /></label>
        <label>Comparisons <input id="compare-group-count" type="number" min="1" value="1" /></label>
        <div class="compare-menu-note" id="compare-menu-note"></div>
        <button type="button" class="tbtn" id="compare-menu-start">Start</button>
      </div>
      <div id="export-mode-wrap" class="show">
        <span class="mode-label">Format:</span>
        <button class="tbtn export-mode-btn active" id="btn-exp-yaml" onclick="setExportMode('aeon-yaml')">AEON</button>
        <button class="tbtn export-mode-btn" id="btn-exp-msyt" onclick="setExportMode('msyt-yaml')">MSYT</button>
        <button class="tbtn export-mode-btn" id="btn-exp-bcml" onclick="setExportMode('msyt-bcml')" style="display: none;">texts.json</button>
      </div>
      <button class="tbtn" id="btn-tag" onclick="openTP()">＋ Tag</button>
      <button class="tbtn" id="btn-autosplit" onclick="toggleAutoSplit()" title="Auto-wrap into a new bubble after 3 lines">✂ Auto-split: ON</button>
      <div class="sep"></div>
      <label style="font-size:12px;color:#666" for="global-type-select">All:</label>
      <select id="global-type-select" class="tbtn" style="padding:4px 6px;font-size:12px;cursor:pointer" onchange="applyGlobalType(this.value)">
        <option value="">— type —</option>
        <option value="dialogue">NPC</option>
        <option value="signboard">Sign</option>
        <option value="item">Item</option>
        <option value="compendium">Compendium</option>
        <option value="questBOTW">Quest BotW</option>
        <option value="questTOTK">Quest TotK</option>
        <option value="tip">Tip</option>
        <option value="choice">Choice</option>
      </select>
      <div class="sep"></div>
      <input id="search-box" type="text" placeholder="Search..." oninput="doSearch(this.value)" />
    </div>

    <div id="meta-panel">
      <textarea id="meta-ta" placeholder="YAML metadata (%%% block)..."></textarea>
    </div>

    <div id="layout">
      <aside id="sidebar"></aside>

      <main id="editor-area">
        <div id="empty-state">
          <div class="icon">📝</div>
          <div>Open a .yaml, .msyt, or BotW BCML texts.json file, or drop it here</div>
          <button class="empty-add-btn" onclick="openNC()">＋ Create Entry</button>
        </div>
        <div id="chain-list"></div>
      </main>
    </div>

    <div id="statusbar">Ready</div>

    <div id="te-modal" onclick="if(event.target===this)closeTE()">
      <div id="te-box">
        <h3 id="te-title">Edit Tag</h3>
        <div id="te-fields"></div>
        <div class="te-btns">
          <button class="btn-del" onclick="deleteTE()">Delete</button>
          <button onclick="closeTE()">Cancel</button>
          <button class="btn-save" onclick="saveTE()">Save</button>
        </div>
      </div>
    </div>

    <div id="tag-picker" onclick="if(event.target===this)closeTP()">
      <div id="tp-box">
        <input id="tp-search" placeholder="Search tag..." oninput="filterTP(this.value)" autocomplete="off" onkeydown="tpKey(event)" />
        <div id="tp-list"></div>
      </div>
    </div>

    <div id="raw-modal" onclick="if(event.target===this)closeRaw()">
      <div id="raw-box">
        <h3>Edit With Tags</h3>
        <textarea id="raw-text" spellcheck="false"></textarea>
        <div class="te-btns">
          <button class="btn-save" id="raw-apply">Apply</button>
          <button id="raw-close">Close</button>
        </div>
      </div>
    </div>

    <div id="compare-modal" onclick="if(event.target===this)closeCompare()">
      <div id="compare-box">
        <div class="compare-head">
          <h3 id="compare-title">Compare</h3>
          <div class="compare-layout">
            <button class="tbtn active" id="compare-layout-unified" onclick="setCompareLayout('unified')">Unified</button>
            <button class="tbtn" id="compare-layout-split" onclick="setCompareLayout('split')">Split</button>
            <button class="tbtn" onclick="closeCompare()">Close</button>
          </div>
        </div>
        <div id="compare-body"></div>
      </div>
    </div>

    <div id="ctx-menu">
      <div class="ctx-item" id="ctx-view-raw">🔍 View With Tags</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" id="ctx-delay8">⏱ Pause 8 Frames</div>
      <div class="ctx-item" id="ctx-delay15">⏱ Pause 15 Frames</div>
      <div class="ctx-item" id="ctx-delay30">⏱ Pause 30 Frames</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" id="ctx-copy-tags">📋 Copy With Tags</div>
      <div class="ctx-item" id="ctx-copy-plain">📄 Copy Without Tags</div>
    </div>

    <script type="module" src="scripts/index.js"></script>
  </body>
</html>
